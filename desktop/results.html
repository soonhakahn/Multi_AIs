<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>답변 모아보기</title>
<style>
  :root { --bg: #0f1420; --panel: #19202f; --line: #2a3347; --text: #eef2f8; --muted: #93a0b8; --accent: #ffb020; --bad: #ff6a5e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 20px; z-index: 1; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .q { color: var(--muted); font-size: 13px; white-space: pre-wrap; max-height: 4.8em; overflow: auto; }
  .bar { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button.primary { background: var(--accent); color: #1b1400; border: 0; font-weight: 700; }
  #note { color: var(--muted); font-size: 13px; }
  main { padding: 16px 20px 40px; display: grid; gap: 14px; max-width: 980px; margin: 0 auto; }
  section { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
  section h2 { margin: 0; padding: 8px 14px; font-size: 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  section h2 span { flex: 1; }
  .text { padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>답변 모아보기</h1>
  <div class="q" id="q"></div>
  <div class="bar"><button class="primary" id="copyAll">전체 복사</button><span id="note"></span></div>
</header>
<main id="list"></main>
<script>
  const $ = (id) => document.getElementById(id);
  let items = [];
  let question = "";

  function note(msg) { $("note").textContent = msg; setTimeout(() => ($("note").textContent = ""), 2500); }

  function combined() {
    const parts = items.filter((i) => i.text).map((i) => "## " + i.name + "\n\n" + i.text);
    return "# 질문\n\n" + question + "\n\n" + parts.join("\n\n---\n\n") + "\n";
  }

  function render() {
    $("q").textContent = question;
    $("list").innerHTML = "";
    for (const it of items) {
      const sec = document.createElement("section");
      const h = document.createElement("h2");
      const name = document.createElement("span");
      name.textContent = it.name;
      h.append(name);
      if (it.text) {
        const b = document.createElement("button");
        b.textContent = "복사";
        b.onclick = async () => { await window.results.copy(it.text); note(it.name + " 답변을 복사했습니다"); };
        h.append(b);
      }
      const body = document.createElement("div");
      body.className = "text" + (it.text ? "" : " empty");
      body.textContent = it.text || "답변을 읽지 못했습니다. 해당 패널에서 답이 나왔는지 확인하세요.";
      sec.append(h, body);
      $("list").append(sec);
    }
  }

  $("copyAll").onclick = async () => { await window.results.copy(combined()); note("전체를 복사했습니다"); };
  window.results.onData((d) => { items = d.items; question = d.question; render(); });
</script>
</body>
</html>
