<!doctype html><meta charset="utf-8"><title>mock hidden first</title>
<style>body{margin:0;font:14px sans-serif;background:#332}.box{margin:12px;min-height:60px;border:1px solid #888;color:#fff;padding:6px}</style>
<p style="color:#fff;margin:12px">mock: hidden textarea first, visible contenteditable second</p>
<textarea style="display:none" id="decoy"></textarea>
<div class="box" contenteditable="true"></div>
<ol id="log" style="color:#9f9"></ol>
<script>
  window.__submitted = [];
  window.__decoyTouched = false;
  document.getElementById("decoy").addEventListener("input", () => (window.__decoyTouched = true));
  const ed = document.querySelector(".box");
  ed.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      window.__submitted.push(ed.innerText.replace(/\n$/, ""));
      document.getElementById("log").insertAdjacentHTML("beforeend", "<li></li>");
      document.getElementById("log").lastChild.textContent = ed.innerText;
      ed.innerHTML = "";
    }
  });
</script>
<script>
  // Test double of an answer appearing after submit: partial text first, then the full answer.
  (() => {
    const orig = window.__submitted.push.bind(window.__submitted);
    window.__submitted.push = (q) => {
      const el = document.createElement("div");
      if (document.title.includes("textarea")) el.setAttribute("data-message-author-role", "assistant");
      document.body.append(el);
      el.textContent = "답변: 생각 중";
      setTimeout(() => (el.textContent = "답변: " + q + " 에 대한 완성된 답"), 700);
      return orig(q);
    };
  })();
</script>
