<!doctype html><meta charset="utf-8"><title>mock quill</title>
<style>body{margin:0;font:14px sans-serif;background:#322}.ql-editor{margin:12px;min-height:60px;border:1px solid #888;color:#fff;padding:6px;display:block}</style>
<p style="color:#fff;margin:12px">mock: rich-textarea .ql-editor (Enter submits)</p>
<rich-textarea><div class="ql-editor" contenteditable="true"></div></rich-textarea>
<ol id="log" style="color:#9f9"></ol>
<script>
  window.__submitted = [];
  const ed = document.querySelector(".ql-editor");
  ed.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      window.__submitted.push(ed.innerText.replace(/\n$/, ""));
      document.getElementById("log").insertAdjacentHTML("beforeend", "<li></li>");
      document.getElementById("log").lastChild.textContent = ed.innerText;
      ed.innerHTML = "";
    }
  });
</script>
